                        <div class="muted" style="font-size:13px; line-height:1.6; margin-bottom:20px;">New withdraw requests aren't being accepted right now. Any request you already submitted before this will still be reviewed and paid normally.</div>
                        <button class="btn btn-outline" id="wd-closed-ok" style="width:100%;">Close</button>
                    </div>
                </div>
            </div>`;
        const okBtn = document.getElementById('wd-closed-ok');
        if (okBtn) okBtn.onclick = () => { document.getElementById('modal-root').innerHTML = ''; };
    }

    // ⚠️ NEW (big update) — promised payout window (server value wins, constants are the fallback)
    function procHours(m) {
        const mm = m || ((status && status.lockedWallet) ? status.lockedWallet.method : method);
        return status?.processingHoursByMethod?.[mm] || WITHDRAW_METHODS_UI[mm]?.hours || status?.processingHours || { min: WITHDRAW_PROCESS_MIN_HOURS_DISPLAY, max: WITHDRAW_PROCESS_MAX_HOURS_DISPLAY };
    }

    // ⚠️ NEW (big update) — "double-check your wallet" step shown before EVERY
    // withdrawal. Layered on document.body (not modal-root) so the withdraw form
    // underneath keeps everything the user typed if they go back to edit.
    function confirmWallet(methodKey, details, wtc) {
        return new Promise((resolve) => {
            document.getElementById('wd-confirm-layer')?.remove();
            const layer = document.createElement('div');
            layer.id = 'wd-confirm-layer';
            layer.className = 'overlay';
            layer.style.zIndex = '120';
            layer.style.alignItems = 'center';
            layer.innerHTML = `
                <div class="sheet anim-in" style="border-radius:18px; padding:22px 18px 18px; max-height:90vh; overflow-y:auto;">
                    <div style="text-align:center; font-size:34px; margin-bottom:6px;">🔎</div>
                    <div class="section-title" style="justify-content:center; margin-bottom:6px;">Double-check your wallet</div>
                    <div class="muted" style="font-size:12.5px; line-height:1.6; text-align:center; margin-bottom:14px;">Your money will be sent to the address below. Check every character — payments sent to a wrong address cannot be recovered.</div>
                    <div class="field-label" style="margin-top:0;">Method</div>
                    <div style="font-weight:600; font-size:14px; margin-bottom:10px;">${WITHDRAW_METHODS_UI[methodKey]?.label || esc(methodKey)}</div>
                    <div class="field-label" style="margin-top:0;">Address / UID</div>
                    <div class="wd-confirm-addr mono-num" translate="no">${esc(details)}</div>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:14px;">
                        <span class="muted" style="font-size:13px;">You receive</span>
                        <span class="mono-num" style="font-size:17px; font-weight:700; color:var(--money);">$${calcNetUsdDisplay(wtc, methodKey).toFixed(4)}</span>
                    </div>
                    <div style="font-size:11.5px; margin-top:6px; color:var(--pending);">⏱ Withdrawals are paid within ${procHours().min}–${procHours().max} hours after you submit.</div>
                    <label style="display:flex; align-items:flex-start; gap:10px; margin:14px 0; font-size:13px; color:var(--ink-muted);">
                        <input type="checkbox" id="wd-confirm-box" style="margin-top:3px;"> <span>I have carefully checked my wallet address and it is correct.</span>
                    </label>
                    <button class="btn btn-money" id="wd-confirm-go" disabled style="margin-bottom:10px;">Confirm & Withdraw</button>
                    <button class="btn btn-outline" id="wd-confirm-back">Go back</button>
                </div>`;
            document.body.appendChild(layer);
            const box = layer.querySelector('#wd-confirm-box');
            const go = layer.querySelector('#wd-confirm-go');
            const finish = (ok) => { layer.remove(); resolve(ok); };
            box.onchange = () => { go.disabled = !box.checked; };
            go.onclick = () => finish(true);
            layer.querySelector('#wd-confirm-back').onclick = () => finish(false);
            layer.onclick = (e) => { if (e.target === layer) finish(false); };
        });
    }

    function reqLine(label, met, detail) {
        return `
        <div style="display:flex; align-items:center; gap:8px; font-size:12.5px; margin-bottom:6px; color:${met ? 'var(--success)' : 'var(--pending)'};">
            <span>${met ? '✅' : '⏳'}</span><span>${label}${detail ? ` <span class="muted" style="color:inherit; opacity:0.85;">${detail}</span>` : ''}</span>
        </div>`;
    }

    // 15 Oct 2026 — "Change Wallet": request → admin accepts in Telegram → user enters the new wallet. Max 2 requests per lifetime.
    function walletChangeHtml() {
        const wc = status?.walletChange || {};
        const box = 'font-size:11.5px; margin:10px 2px 0; line-height:1.5;';
        if (wc.status === 'approved') return `<button class="btn btn-primary" id="wc-apply" style="width:100%; margin-top:12px;">✅ Approved — set your new wallet</button>`;
        if (wc.status === 'pending') return `<div class="muted" style="${box}">⏳ Wallet change request sent — waiting for the admin to accept. You will get a Telegram message.</div>`;
        if ((wc.requestsLeft || 0) > 0) return `<button class="btn btn-outline" id="wc-request" style="width:100%; margin-top:12px; height:40px;">🔄 Change Wallet</button><div class="muted" style="${box}">Needs admin approval · ${wc.requestsLeft} request${wc.requestsLeft === 1 ? '' : 's'} left (lifetime)</div>`;
        return `<div class="muted" style="${box}">🔒 Locked. You have used all wallet change requests.</div>`;
    }
    async function requestWalletChange() {
        if (!confirm('Send a wallet change request to the admin?\n\nYou can send this request only 2 times in your whole life.')) return;
        const btn = document.getElementById('wc-request'); if (btn) { btn.disabled = true; btn.textContent = 'Sending...'; }
        const r = await apiPost('withdraw', { action: 'walletChangeRequest' });
        toast(r.ok ? 'Request sent! You will be notified when the admin decides.' : (r.message || errorText(r.error)), r.ok ? 'success' : 'error');
        await loadStatus();
    }
    function openWalletApplyLayer() {
        document.getElementById('wc-layer')?.remove();
        let m = 'tonkeeper';
        const layer = document.createElement('div');
        layer.id = 'wc-layer'; layer.className = 'overlay'; layer.style.zIndex = '120'; layer.style.alignItems = 'center';
        const paint = () => {
            layer.innerHTML = `
                <div class="sheet anim-in" style="border-radius:18px; padding:22px 18px 18px; max-height:90vh; overflow-y:auto;">
                    <div class="section-title" style="margin-bottom:10px;">Set new wallet</div>
                    <div class="field-label" style="margin-top:0;">Select gateway</div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px;">
                        ${Object.entries(WITHDRAW_METHODS_UI).map(([key, cfg]) => `<button class="btn ${m === key ? 'btn-primary' : 'btn-outline'}" data-wcm="${key}" style="display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; height:56px; font-size:12px;">${cfg.label.split(' ')[0]}<span style="font-size:10px; opacity:0.7; font-weight:500;">${cfg.feePercent}% fee</span></button>`).join('')}
                    </div>
                    <div class="field-label">${WITHDRAW_METHODS_UI[m].label}</div>
                    <input class="field-input" id="wc-details" placeholder="${WITHDRAW_METHODS_UI[m].placeholder}">
                    <div class="muted" style="font-size:11px; margin:-8px 0 12px;">⚠️ Double-check every character. Money sent to a wrong address cannot be recovered.</div>
                    <button class="btn btn-money" id="wc-save">Save new wallet</button>
                    <button class="btn btn-outline" id="wc-cancel" style="margin-top:8px;">Cancel</button>
                </div>`;
            layer.querySelectorAll('[data-wcm]').forEach(b => { b.onclick = () => { const v = layer.querySelector('#wc-details')?.value; m = b.dataset.wcm; paint(); if (v) layer.querySelector('#wc-details').value = v; }; });
            layer.querySelector('#wc-cancel').onclick = () => layer.remove();
            layer.querySelector('#wc-save').onclick = async () => {
                const details = layer.querySelector('#wc-details').value.trim();
                if (!/^[A-Za-z0-9_\-:.+\/=]{5,100}$/.test(details)) return toast(errorText('invalid_address'), 'error');
                if (!confirm('Save this wallet?\n\n' + WITHDRAW_METHODS_UI[m].label + '\n' + details)) return;
                const b = layer.querySelector('#wc-save'); b.disabled = true; b.textContent = 'Saving...';
                const r = await apiPost('withdraw', { action: 'walletChangeApply', method: m, details });
                if (r.ok) { toast('Wallet updated ✅', 'success'); layer.remove(); await loadStatus(); }
                else { toast(r.message || errorText(r.error), 'error'); b.disabled = false; b.textContent = 'Save new wallet'; }
            };
        };
        paint();
        document.body.appendChild(layer);
    }

    // ═══ NEW DESIGN (15 Oct 2026) — full-screen page: hero balance → method cards (fee + time) → amount with quick chips →
    //     live breakdown → requirement tiles → sticky Withdraw bar. All logic/ids (wd-details, wd-amount, wd-submit, wd-receive) kept. ═══
    function currentMethod() { return (status && status.lockedWallet) ? status.lockedWallet.method : method; }
    function hoursText(m) { const h = procHours(m); return h.min + '–' + h.max + ' hours'; }

    function reqTile(icon, title, have, need, met, extraId) {
        const pct = need > 0 ? Math.min(100, Math.round((have / need) * 100)) : 100;
        return `
            <div class="wd-tile ${met ? 'is-met' : ''}">
                <div class="wd-tile-top"><span class="wd-tile-ic">${icon}</span><span class="wd-tile-st">${met ? '✓' : ''}</span></div>
                <div class="wd-tile-t">${title}</div>
                <div class="wd-tile-n" ${extraId ? `id="${extraId}"` : ''}>${Math.min(have, need)}<span>/${need}</span></div>
                <div class="wd-bar"><div style="width:${pct}%"></div></div>
            </div>`;
    }

    function render() {
        if (!status) {
            document.getElementById('modal-root').innerHTML = `
                <div class="overlay wd-ov"><div class="wd-page">
                    <div class="wd-head"><button class="wd-x" id="wd-close">‹</button><div class="wd-title">Withdraw</div><span style="width:36px"></span></div>
                    <div class="wd-body">
                        <div class="skel" style="height:110px; width:100%; margin-bottom:14px; border-radius:20px;"></div>
                        <div class="skel" style="height:84px; width:100%; margin-bottom:12px; border-radius:16px;"></div>
                        <div class="skel" style="height:84px; width:100%; margin-bottom:12px; border-radius:16px;"></div>
                        <div class="skel" style="height:120px; width:100%; border-radius:16px;"></div>
                    </div>
                </div></div>`;
            const c0 = document.getElementById('wd-close'); if (c0) c0.onclick = () => { document.getElementById('modal-root').innerHTML = ''; };
            return;
        }
        const u = state.user || {};
        const wtcBalance = u.wtcBalance || 0;
        const rq = status.withdrawRequirements;
        const rf = status.referralRequirement;
        const locked = status.lockedWallet;
        const cm = currentMethod();
        const balUsd = wtcBalance / WTC_PER_USD_DISPLAY;

        const methodCards = Object.entries(WITHDRAW_METHODS_UI).map(([key, cfg]) => `
            <button class="wd-method ${method === key ? 'is-on' : ''}" data-method="${key}">
                <span class="wd-radio"></span>
                <span class="wd-m-ic">${cfg.icon}</span>
                <span class="wd-m-mid">
                    <span class="wd-m-name">${cfg.label}</span>
                    <span class="wd-m-sub">⏱ ${hoursText(key)}${cfg.auto ? ' · ⚡ Auto-paid' : ''}</span>
                </span>
                <span class="wd-m-fee">${cfg.feePercent}%<small>fee</small></span>
            </button>`).join('');

        const walletBlock = locked ? `
            <div class="wd-sec">Paying out to</div>
            <div class="wd-wallet">
                <div class="wd-wallet-row">
                    <span class="wd-m-ic">${WITHDRAW_METHODS_UI[locked.method]?.icon || '💳'}</span>
                    <span class="wd-m-mid">
                        <span class="wd-m-name">${WITHDRAW_METHODS_UI[locked.method]?.label || esc(locked.method)}</span>
                        <span class="wd-m-sub">⏱ ${hoursText(locked.method)} · ${feePctFor(locked.method)}% fee</span>
                    </span>
                    <span class="wd-lock">🔒</span>
                </div>
                <div class="wd-addr mono-num">${esc(locked.address)}</div>
                ${walletChangeHtml()}
            </div>` : `
            <div class="wd-sec">Choose how to get paid</div>
            <div class="wd-methods">${methodCards}</div>
            <div class="wd-sec">${WITHDRAW_METHODS_UI[method].label}</div>
            <input class="field-input wd-input" id="wd-details" placeholder="${WITHDRAW_METHODS_UI[method].placeholder}">
            <div class="wd-hint">⚠️ This becomes your wallet and is locked after your first withdrawal. Double-check every character.</div>`;

        document.getElementById('modal-root').innerHTML = `
            <div class="overlay wd-ov"><div class="wd-page">
                <div class="wd-head"><button class="wd-x" id="wd-close">‹</button><div class="wd-title">Withdraw</div><span style="width:36px"></span></div>
                <div class="wd-body">
                    <div class="wd-hero">
                        <div class="wd-hero-l">Available balance</div>
                        <div class="wd-hero-n mono-num">$${balUsd.toFixed(4)}<span> USDT</span></div>
                        <div class="wd-hero-s mono-num">${fmtWTC(wtcBalance)} WTC · ${fmtWTC(WTC_PER_USD_DISPLAY)} WTC = 1 USDT</div>
                    </div>

                    ${walletBlock}

                    <div class="wd-sec">Amount</div>
                    <div class="wd-amt">
                        <input id="wd-amount" type="number" inputmode="numeric" placeholder="${MIN_WITHDRAW_WTC}">
                        <span>WTC</span>
                    </div>
                    <div class="wd-chips">
                        <button class="wd-chip" data-chip="min">Min ${fmtWTC(MIN_WITHDRAW_WTC)}</button>
                        <button class="wd-chip" data-chip="0.25">25%</button>
                        <button class="wd-chip" data-chip="0.5">50%</button>
                        <button class="wd-chip" id="wd-max" data-chip="1">MAX</button>
                    </div>

                    <div class="wd-sum">
                        <div class="wd-sum-r"><span>Amount</span><b id="wd-b-gross" class="mono-num">$0.0000</b></div>
                        <div class="wd-sum-r"><span id="wd-b-feelbl">Fee (${feePctFor(cm)}%)</span><b id="wd-b-fee" class="mono-num">−$0.0000</b></div>
                        <div class="wd-sum-r wd-sum-total"><span>You receive</span><b id="wd-receive" class="mono-num">$0.0000</b></div>
                    </div>

                    <div class="wd-sec">Requirements</div>
                    <div class="wd-tiles">
                        ${reqTile('📺', 'Ads (last 24h)', rq.adsWatchedToday, rq.adsRequired, rq.adsMet)}
                        ${reqTile('✅', 'Tasks (one-time)', rq.tasksHave, rq.tasksRequired, rq.tasksMet)}
                        ${rf.isFreePhase
                            ? `<div class="wd-tile is-met"><div class="wd-tile-top"><span class="wd-tile-ic">👥</span><span class="wd-tile-st">✓</span></div><div class="wd-tile-t">Referrals</div><div class="wd-tile-n" style="font-size:13px;">Not needed yet</div><div class="wd-bar"><div style="width:100%"></div></div></div>`
                            : `<div class="wd-tile" id="wd-reftile"><div class="wd-tile-top"><span class="wd-tile-ic">👥</span><span class="wd-tile-st" id="wd-ref-st"></span></div><div class="wd-tile-t">Valid referrals</div><div class="wd-tile-n" id="wd-ref-n">${rf.validReferralsAvailable}<span> available</span></div><div class="wd-bar"><div id="wd-ref-bar" style="width:0%"></div></div></div>`}
                    </div>
                    ${rq.accountAgeRequiredHours > 0 ? `<div class="wd-hint" style="margin-top:8px;">${rq.accountAgeMet ? '✅' : '⏳'} Account must be ${rq.accountAgeRequiredHours}h old (${rq.accountAgeHoursRemaining}h left)</div>` : ''}
                    <div class="wd-note">⏱ <b>${esc(WITHDRAW_METHODS_UI[cm].label)}</b> withdrawals are paid within <b>${hoursText(cm)}</b> after you submit.${rf.isFreePhase ? ` First ${rf.freeWithdrawalsTotal} withdrawals: max $${rf.freeWithdrawMaxUsd} each.` : ` Each withdrawal needs ${rf.referralsPerWithdraw || WITHDRAW_REFS_PER_WITHDRAW_UI} valid referrals · max ${fmtWTC(rf.maxWtcWithReferralTotal || WITHDRAW_MAX_WTC_UI)} WTC per withdrawal.`}</div>
                    <div style="height:86px"></div>
                </div>
                <div class="wd-foot"><button class="btn btn-money" id="wd-submit" disabled>Loading...</button></div>
            </div></div>`;

        document.getElementById('wd-close').onclick = () => { document.getElementById('modal-root').innerHTML = ''; };
        document.querySelectorAll('[data-method]').forEach(btn => {
            btn.onclick = () => { const v = document.getElementById('wd-details')?.value || ''; const a = document.getElementById('wd-amount')?.value || ''; method = btn.dataset.method; render(); const d = document.getElementById('wd-details'); if (d) d.value = v; const am = document.getElementById('wd-amount'); if (am) { am.value = a; updateReceiveAndSubmit(); } };
        });
        document.querySelectorAll('[data-chip]').forEach(ch => {
            ch.onclick = () => {
                const cap = rf.isFreePhase ? Math.min(wtcBalance, rf.freeWithdrawMaxWtc) : Math.min(wtcBalance, rf.maxWtcWithReferralTotal || WITHDRAW_MAX_WTC_UI);
                const v = ch.dataset.chip === 'min' ? MIN_WITHDRAW_WTC : Math.floor(cap * parseFloat(ch.dataset.chip));
                document.getElementById('wd-amount').value = v;
                updateReceiveAndSubmit();
            };
        });
        document.getElementById('wd-amount').oninput = updateReceiveAndSubmit;
        document.getElementById('wd-submit').onclick = submitWithdraw;
        const wcReq = document.getElementById('wc-request'); if (wcReq) wcReq.onclick = requestWalletChange;
        const wcApp = document.getElementById('wc-apply'); if (wcApp) wcApp.onclick = openWalletApplyLayer;
        updateReceiveAndSubmit();
    }

    function updateReceiveAndSubmit() {
        const amountEl = document.getElementById('wd-amount');
        const btn = document.getElementById('wd-submit');
        if (!amountEl || !btn) return;
        const wtc = Math.floor(parseFloat(amountEl.value) || 0);
        const cm = currentMethod();
        const gross = wtc / WTC_PER_USD_DISPLAY;
        const net = calcNetUsdDisplay(wtc, cm);
        const setT = (id, t) => { const el = document.getElementById(id); if (el) el.textContent = t; };
        setT('wd-b-gross', '$' + gross.toFixed(4));
        setT('wd-b-fee', '−$' + (gross - net).toFixed(4));
        setT('wd-b-feelbl', 'Fee (' + feePctFor(cm) + '%)');
        setT('wd-receive', '$' + net.toFixed(4));

        if (!status) { btn.disabled = true; btn.textContent = loadFailed ? 'Retry' : 'Loading...'; return; }
        const u = state.user || {};
        const wtcBalance = u.wtcBalance || 0;
        const rq = status.withdrawRequirements;
        const reqOk = rq.adsMet && rq.tasksMet && rq.accountAgeMet !== false;
        const referralsNeeded = status.referralRequirement.isFreePhase ? 0 : (status.referralRequirement.referralsPerWithdraw || WITHDRAW_REFS_PER_WITHDRAW_UI);
        const refOk = status.referralRequirement.isFreePhase || status.referralRequirement.validReferralsAvailable >= referralsNeeded;
        if (!status.referralRequirement.isFreePhase) {
            const have = status.referralRequirement.validReferralsAvailable;
            setT('wd-ref-n', wtc > 0 ? `${have} / ${referralsNeeded} needed` : `${have} available`);
            const bar = document.getElementById('wd-ref-bar'); if (bar) bar.style.width = Math.min(100, wtc > 0 ? Math.round(have / referralsNeeded * 100) : 100) + '%';
            const st = document.getElementById('wd-ref-st'); if (st) st.textContent = (wtc > 0 && refOk) ? '✓' : '';
            const tile = document.getElementById('wd-reftile'); if (tile) tile.classList.toggle('is-met', wtc > 0 && refOk);
        }
        if (loadFailed) { btn.disabled = false; btn.textContent = 'Retry'; return; }
        if (status.withdrawPending) { btn.disabled = true; btn.textContent = 'A request is already pending'; return; }
        if (wtc < MIN_WITHDRAW_WTC) { btn.disabled = true; btn.textContent = `Minimum ${fmtWTC(MIN_WITHDRAW_WTC)} WTC`; return; }
        if (wtc > wtcBalance) { btn.disabled = true; btn.textContent = 'Insufficient WTC balance'; return; }
        if (status.referralRequirement.isFreePhase && wtc > status.referralRequirement.freeWithdrawMaxWtc) {
            btn.disabled = true; btn.textContent = `Max $${status.referralRequirement.freeWithdrawMaxUsd} (${fmtWTC(status.referralRequirement.freeWithdrawMaxWtc)} WTC) per withdrawal`; return;
        }
        if (!status.referralRequirement.isFreePhase && wtc > (status.referralRequirement.maxWtcWithReferralTotal || WITHDRAW_MAX_WTC_UI)) {
            btn.disabled = true; btn.textContent = `Max ${fmtWTC(status.referralRequirement.maxWtcWithReferralTotal || WITHDRAW_MAX_WTC_UI)} WTC per withdrawal`; return;
        }
        if (!reqOk) { btn.disabled = true; btn.textContent = 'Complete requirements above'; return; }
        if (!refOk) { btn.disabled = true; btn.textContent = `Need ${referralsNeeded} valid referral${referralsNeeded === 1 ? '' : 's'} (have ${status.referralRequirement.validReferralsAvailable})`; return; }
        btn.disabled = false;
        btn.textContent = `Withdraw ${fmtWTC(wtc)} WTC  →  $${net.toFixed(4)}`;
    }

    async function loadStatus() {
        const r = await apiGet(`withdraw?action=status&initData=${encodeURIComponent(TG_INIT_DATA)}`);
        if (!r.ok) {
            loadFailed = true;
            updateReceiveAndSubmit();
            return;
        }
        if (r.withdrawalsOpen === false) {
            withdrawalsOpen = false;
            renderClosed();
            return;
        }
        loadFailed = false;
        status = r;
        // ⚠️ NEW — if a wallet is already locked, sync the selector to it
        // (though it won't be shown/editable — see render() below).
        if (status.lockedWallet) method = status.lockedWallet.method;
        render();
    }

    async function submitWithdraw() {
        // ⚠️ CHANGED — when a wallet is already locked, there's no #wd-details
        // input in the DOM at all (see render() above) — use the locked
        // address directly. The server ignores/overrides this anyway (see
        // api/withdraw.js), but sending it keeps this function simple.
        const details = status.lockedWallet ? status.lockedWallet.address : document.getElementById('wd-details').value.trim();
        const wtcAmount = Math.floor(parseFloat(document.getElementById('wd-amount').value) || 0);
        if (loadFailed) { loadStatus(); return; }
        if (!details) return toast('Please enter your address/UID.', 'error');
        if (!status.lockedWallet && !/^[A-Za-z0-9_\-:.+\/=]{5,100}$/.test(details)) return toast(errorText('invalid_address'), 'error');
        if (!wtcAmount) return toast('Please enter an amount.', 'error');

        // ⚠️ NEW (big update) — user must look at the wallet address before money leaves.
        const okToSend = await confirmWallet(status.lockedWallet ? status.lockedWallet.method : method, details, wtcAmount);
        if (!okToSend) return;

        const btn = document.getElementById('wd-submit');
        btn.textContent = 'Submitting...'; btn.disabled = true;
        const r = await apiPost('withdraw', { method, details, wtcAmount });
        if (r.ok) {
            toast(`Withdraw request submitted — you'll be paid within ${procHours().min}–${procHours().max} hours.`, 'success');
            triggerBurst(btn);
            setTimeout(() => { document.getElementById('modal-root').innerHTML = ''; }, 200);
            await refreshUser();
            if (state.activeTab === 'home') renderHome(); else if (state.activeTab === 'profile') renderProfileTab();
        } else {
            toast(r.message || errorText(r.error), 'error');
            await loadStatus();
        }
    }

    render();
    loadStatus();
}

// ══════════════════════════════════════════════════════════════
// PROMO MODAL
// ══════════════════════════════════════════════════════════════
// ⚠️ Currently not called from anywhere (the inline Home promo box replaced
// it) — kept in case a modal-style promo entry point is wanted again later
// (e.g. from another tab). Uses the same shared redeemPromoCode() as Home,
// so re-enabling this never risks drifting out of sync with the anti-abuse
// ad-gate logic.
function openPromoModal() {
    document.getElementById('modal-root').innerHTML = `

                <div style="font-weight:600; font-size:17px; margin-bottom:4px; text-align:center;">🎁 Promo code</div>

            </div>
        </div>`;
    const input = document.getElementById('promo-code');
    const submit = () => redeemPromoCode(
        input.value.trim(),
        document.getElementById('promo-submit'),
        () => { document.getElementById('modal-root').innerHTML = ''; }   // close instantly; balance refreshes in the background

// Yields the same permutation for everyone all day, then a different one
// tomorrow — a tiny linear-congruential PRNG seeded from the date string,
// no crypto needed since this is just display order, not anything security-sensitive.
function todayStr() { const d = new Date(); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; }
function seededShuffle(arr, seedStr) {
    let seed = 0;
    for (let i = 0; i < seedStr.length; i++) seed = (seed * 31 + seedStr.charCodeAt(i)) >>> 0;
    const rand = () => { seed = (seed * 1103515245 + 12345) >>> 0; return seed / 4294967296; };
    const out = [...arr];
    for (let i = out.length - 1; i > 0; i--) {
        const j = Math.floor(rand() * (i + 1));
        [out[i], out[j]] = [out[j], out[i]];
    }
    return out;
}

    if (!el) {
        el = document.createElement('button');
        el.id = 'floating-lootbox';
        el.style.cssText = 'position:fixed; right:18px; bottom:120px; width:64px; height:64px; border-radius:50%; background:var(--surface-raised); display:flex; align-items:center; justify-content:center; z-index:50; box-shadow:0 8px 20px rgba(0,0,0,0.4);';

        document.body.appendChild(el);
        el.onclick = tryClaimLootbox;
    }
    const pending = state.user?.pendingVideoWTC || 0;
    const claimable = pending >= 25;
    const pct = Math.min(1, pending / 25);

    document.getElementById('lb-amount').style.color = claimable ? 'var(--video-hue)' : 'var(--ink-muted)';
    document.getElementById('lb-progress-ring').style.strokeDashoffset = circumference - (circumference * pct);
    el.classList.toggle('claimable', claimable);

    // ── "please claim!" hint — stays visible next to the lootbox for as long
    // as it's claimable, since the backend now refuses to credit any more
    // video WTC until the user actually claims it.
    let hint = document.getElementById('lb-claim-hint');

        hint.style.top = `${rect.top + rect.height / 2 - 12}px`;
        hint.style.left = `${rect.left - 108}px`;
    } else if (hint) {
        hint.remove();
    }
}

function showLootboxGain(amount) {
    const lb = document.getElementById('floating-lootbox');

    el.style.left = `${rect.left + rect.width / 2 - 14}px`;

async function tryClaimLootbox() {
    const pending = state.user?.pendingVideoWTC || 0;
    if (pending < 25) { toast(`You need at least 25 WTC to claim (currently ${fmtWTC(pending)}).`, 'info'); return; }

    // ⚠️ SECURITY FIX — request a signed token FIRST (before the ad even
    // loads), same pattern as watchAdNetwork's adStart. The server checks
    // real elapsed time between this and the claim call, so the ad can't be
    // skipped by calling claimLootbox directly.
    const startRes = await apiPost('earn', { action: 'lootboxAdStart' });
    if (!startRes.ok) { toast(errorText(startRes.error), 'error'); return; }

    // 17 Oct 2026 — SECURITY: the SERVER picks the ad network (startRes.network: Adsgram Special or GigaPub) and pays the
    // lootbox only after THAT network's own server confirmed the view (see handleLootboxAdStart / handleClaimLootbox in api/earn.js).
    // The app just plays the ad it was told to play, then asks the server for the claim a few times until the proof arrives.
    const showFn = startRes.network === 'adsgramSpecial' ? showAdsgramSpecialAd : showGigaPubAd;
    toast('Loading ad...', 'info');
    window.__adBusy = true;
    try {
        try { await showFn(); }
        catch (e) { toast('Ad isn\'t available right now. Please try again.', 'error'); return; }
        toast('Confirming your reward…', 'info');
        await claimLootboxNow(startRes.startTime, startRes.signature);
    } catch (e) {
        toast(errorText(e.message), 'error');
    } finally {
        setTimeout(() => { window.__adBusy = false; }, 1500);
    }
}

async function claimLootboxNow(startTime, signature) {
    let r = await apiPost('earn', { action: 'claimLootbox', startTime, signature });
    // the ad network's server confirms the view a moment AFTER the ad closes → retry a few times (same as Mining)
    for (let i = 0; i < 2 && !r.ok && r.error === 'proof_pending'; i++) { // v1.3: the server now waits ~9s itself
        await new Promise(res => setTimeout(res, 500));
        r = await apiPost('earn', { action: 'claimLootbox', startTime, signature });
    }
    if (r.ok) {
        state._lootboxNudgeShown = false;
        toast(`+${fmtWTC(r.pointsAdded)} WTC added to your balance!`, 'success');
        triggerBurst(document.getElementById('floating-lootbox'));
        showCongrats(`+${fmtWTC(r.pointsAdded)} WTC`, '🪙', `≈ $${wtcToUsd(r.pointsAdded)} USD`);
        await refreshUser();
        renderFloatingLootbox();
        if (state.activeTab === 'home') renderHome(); else if (state.activeTab === 'profile') renderProfileTab();
    } else { toast(errorText(r.error), 'error'); }
}

// v1.5: with a bigger claim batch, up to ~6 minutes of watching could be lost when the player is closed. This sends the
// leftover whole WTC once when the user leaves / switches video (one call, only when at least 1 WTC is waiting).
function flushVideoClaim() {
    try {
        const s = state.videoSession;
        if (!s || state._vidClaimBusy || state._vidPaused) return;
        if ((state.user?.pendingVideoWTC || 0) >= 25) return;
        const elapsedSec = (Date.now() - s.startTime) / 1000;
        if (elapsedSec > 470) return; // token about to expire / expired -> nothing to claim
        const claimable = Math.floor(elapsedSec * (100 / 3600) + 1e-6);
        if (claimable < 1) return;
        apiPost('earn', { action: 'videoClaim', startTime: s.startTime, signature: s.signature, claimedPoints: claimable })
            .then(r => {
                if (r && r.ok && state.user) {
                    state.user.pendingVideoWTC = r.pendingVideoWTC;
                    try { renderFloatingLootbox(); } catch (e) {}
                }
            }).catch(() => {});
    } catch (e) { /* never block closing the player */ }
}

function switchVideoPlayer(newVideo) {
    // Stops the previous session's timer and starts the new video — switches without closing the modal
    flushVideoClaim();
    if (state.videoSessionInterval) clearInterval(state.videoSessionInterval);
    if (state.videoDisplayInterval) clearInterval(state.videoDisplayInterval);
    state.videoSession = null;
    openVideoPlayer(newVideo);
}

let sessionEarnedTotal = 0;
let sessionDisplayWTC = 0; // visual only — increments every 10s for mining feel
let videoWatchSeconds = 0;
let lastMonetagInterstitialAt = 0;
let lastAdsgramVideoInterstitialAt = 0;
let nextAdsgramVideoAt = 0;   // watch-seconds at which the next passive video ad slot is due (random 5–7 min gap)
let videoPassiveSlot = 0;     // rotation counter for VIDEO_PASSIVE_ADS
const VIDEO_PASSIVE_ADS = ['adsgram', 'monetag'];   // which networks take turns in the video-section ad slots (edit here)

function updateLootboxFullUI(isFull) {
    const banner = document.getElementById('vp-lootbox-full-banner');
    const sub = document.getElementById('vp-session-sub');
    if (!banner || !sub) return;
    banner.style.display = isFull ? 'block' : 'none';
    sub.textContent = isFull ? 'Paused — claim your lootbox to resume earning' : '100 WTC earned per hour watched';
}

async function startVideoSession() {
    sessionEarnedTotal = 0;
    sessionDisplayWTC = 0;
    videoWatchSeconds = 0;
    lastMonetagInterstitialAt = 0;
    lastAdsgramVideoInterstitialAt = 0;
    nextAdsgramVideoAt = nextAdsgramVideoGap();      // first passive ad 5–7 min after this video session starts
    videoPassiveSlot = 0;                            // rotation restarts with Adsgram
    const startRes = await apiPost('earn', { action: 'videoStart' }); // ⚠️ CHANGED — userId no longer sent; server now derives it from verified initData only (see api/earn.js)
    if (!startRes.success) { toast(errorText(startRes.error), 'error'); return; }
    state.videoSession = { startTime: startRes.startTime, signature: startRes.signature };
    updateLootboxFullUI((state.user?.pendingVideoWTC || 0) >= 25);

    // ── Visual counter: every 10 seconds, adds ~0.278 WTC (= 100 WTC/hr / 360 ticks/hr)
    // This is purely for display — it makes the UI feel like a miner ticking up.
    // The real WTC is only credited by the 30-second backend call below.
    // ⚠️ FIX: this used to keep climbing even after the backend stopped crediting
    // (once pendingVideoWTC hits the 25 WTC claim threshold), so the video page
    // could show e.g. "90 WTC" for a full hour watched while the real claimable
    // amount silently capped out much lower — a confusing "where did my WTC go"
    // moment when the user went back to actually claim. Now the ticker freezes
    // (and shows the same lootbox-full banner) the instant the real cap is hit,
    // so the number on screen is always the number they'll actually get.
    state.videoDisplayInterval = setInterval(() => {
        if (!state.videoSession) return;
        if ((state.user?.pendingVideoWTC || 0) >= 25) { updateLootboxFullUI(true); return; }
        sessionDisplayWTC = parseFloat((sessionDisplayWTC + 0.278).toFixed(3));
        const out = document.getElementById('vp-session-wtc');
        if (out) out.textContent = `${sessionDisplayWTC.toFixed(1)} WTC`;
    }, 10000);

    // ── Backend API: credits WTC to pendingVideoWTC ──
    // 20 Oct 2026 (admin): 100 WTC per hour (= 1 WTC every 36 seconds). The server only credits WHOLE WTC, so a fixed 30s timer would
    // throw away the fraction every time (about 0.83 WTC per 30s -> 0) and the real rate would be far below 100/hr.
    // Now this checks once a second and claims as soon as 2 whole WTC (72 seconds of the current token) are earned — almost nothing is lost.
    const VIDEO_WTC_PER_HOUR = 100;          // keep in sync with lib/constants.js VIDEO_WTC_PER_MINUTE
    const VIDEO_CLAIM_BATCH = 10;            // v1.5: claim every 10 WTC = 360 seconds (v1.2 was 5 = 180s, originally 2 = 72s) -> half the server calls; the server token now lives 480s (api/earn.js). Leftover time is sent when the player is closed (flushVideoClaim).
    state._vidClaimBusy = false;
    state._vidPaused = false;
    state.videoSessionInterval = setInterval(async () => {
        if (!state.videoSession) return;
        videoWatchSeconds += 1;

        // ONE passive ad slot every 5–7 minutes of video watching (see VIDEO_PASSIVE_ADS above).
        if (videoWatchSeconds >= nextAdsgramVideoAt) {
            nextAdsgramVideoAt = videoWatchSeconds + nextAdsgramVideoGap();
            const kind = VIDEO_PASSIVE_ADS[videoPassiveSlot++ % VIDEO_PASSIVE_ADS.length];
            if (kind === 'monetag') fireMonetagInAppInterstitial();               // checks state.videoSession itself
            else showAdsgramInterstitial({ requireVideo: true });                 // refuses unless the video player is open
        }

        if (state._vidClaimBusy || Date.now() < (state._vidRetryAt || 0)) return;

        // once 25+ WTC is already sitting unclaimed in the lootbox the backend won't credit more — pause (the session stays alive
        // and resumes right after the claim) and nudge the user once.
        if ((state.user?.pendingVideoWTC || 0) >= 25) {
            state._vidPaused = true;
            updateLootboxFullUI(true);
            if (!state._lootboxNudgeShown) {
                state._lootboxNudgeShown = true;
                toast('🎁 Your lootbox is full — claim it to keep earning!', 'info');
            }
            return;
        }
        updateLootboxFullUI(false);

        // coming back from a pause: start a fresh token so the time spent paused is not counted
        if (state._vidPaused) {
            state._vidPaused = false;
            state._vidClaimBusy = true;
            try {
                const fresh = await apiPost('earn', { action: 'videoStart' });
                if (fresh.success) state.videoSession = { startTime: fresh.startTime, signature: fresh.signature };
            } finally { state._vidClaimBusy = false; }
            return;
        }

        const elapsedSec = (Date.now() - state.videoSession.startTime) / 1000;
        const claimable = Math.floor(elapsedSec * (VIDEO_WTC_PER_HOUR / 3600) + 1e-6);
        if (claimable < VIDEO_CLAIM_BATCH) return;

        state._vidClaimBusy = true;
        try {
            const r = await apiPost('earn', { action: 'videoClaim', startTime: state.videoSession.startTime, signature: state.videoSession.signature, claimedPoints: claimable });
            if (r.ok) {
                sessionEarnedTotal += claimable;
                // Sync display to actual earned value after each real credit
                sessionDisplayWTC = Math.max(sessionDisplayWTC, sessionEarnedTotal);
                const out = document.getElementById('vp-session-wtc');
                if (out) out.textContent = `${sessionDisplayWTC.toFixed(1)} WTC`;
                if (state.user) state.user.pendingVideoWTC = r.pendingVideoWTC;
                renderFloatingLootbox();
                showLootboxGain(claimable);
                if (r.nextStartTime && r.nextSignature) state.videoSession = { startTime: r.nextStartTime, signature: r.nextSignature }; // v1.3: token comes with the claim answer
                else {
                    const fresh = await apiPost('earn', { action: 'videoStart' });
                    if (fresh.success) state.videoSession = { startTime: fresh.startTime, signature: fresh.signature };
                }
            } else if (r.error === 'lootbox_claim_required') {
                if (state.user) state.user.pendingVideoWTC = Math.max(state.user.pendingVideoWTC || 0, 25);
                updateLootboxFullUI(true);
                if (!state._lootboxNudgeShown) {
                    state._lootboxNudgeShown = true;
                    toast('🎁 Your lootbox is full — claim it to keep earning!', 'info');
                }
            } else {
                // video_token_expired / invalid_signature / any other rejection: get a fresh token silently and keep the session going
                // (the elapsed time already missed is lost by design, same as every other ad/task token here).
                state._vidRetryAt = Date.now() + 10000; // never hammer the server if it keeps refusing
                const fresh = await apiPost('earn', { action: 'videoStart' });
                if (fresh.success) state.videoSession = { startTime: fresh.startTime, signature: fresh.signature };
            }
        } finally { state._vidClaimBusy = false; }
    }, 1000);
}

function closeVideoPlayer() {
    flushVideoClaim();
    if (state.videoSessionInterval) clearInterval(state.videoSessionInterval);
    if (state.videoDisplayInterval) clearInterval(state.videoDisplayInterval);
    state.videoSession = null;
    document.getElementById('modal-root').innerHTML = '';
    renderVideoTab();
}

// ⚠️ SECURITY FIX — now requests a signed ad-token from the server BEFORE
// showing the ad (adStart), and passes that exact token through to
// creditAdReward afterward. A bare "network name" is no longer enough to
// get a reward — see api/earn.js.
// ⚠️ REMOVED (this update) — the Monetag-specific ymid/postback branch that
// used to live here. Admin decision: reverted Monetag back to the same
// adStart→show→claimAdReward flow every other network uses (see
// AD_NETWORK_REWARDS in lib/constants.js).
// Monetag: no adStart token, no timing data sent (server flag noSecurity in lib/constants.js)
const NO_TOKEN_NETWORKS = new Set(['monetag']);
// 🔒 Adsgram S2S networks: the phone NEVER claims these. Adsgram's own server calls our API
// (Reward URL, see api/earn.js handleAdsgramS2S) and the server credits WTC itself.
// The app just waits for the balance/counter to move, then celebrates.
const S2S_NETWORKS = new Set(['adsgramSpecial']);
async function waitForS2sReward({ counterField, reward, anchorEl, icon }) {
    const before = (state.user && state.user[counterField]) || 0;
    toast('Confirming your reward…', 'info');
    // v1.3 (saves Vercel usage): ONE request that waits on the server (up to ~10s), max 2 tries — was up to 14 profile downloads per ad.
    for (let i = 0; i < 2; i++) {
        const w = await apiPost('earn', { action: 'waitS2s', counterField, before });
        if (w && w.ok && w.done) {
            try { await refreshUserLazy(u => {
                u.wtcBalance = (u.wtcBalance || 0) + reward;
                u.lifetimeWtcEarned = (u.lifetimeWtcEarned || 0) + reward;
                u.lifetimeAdsWatched = (u.lifetimeAdsWatched || 0) + 1;
                u[counterField] = before + 1;
            }); } catch (e) { /* ignore */ }
            toast(`+${reward} WTC added!`, 'success');
            if (anchorEl) triggerBurst(anchorEl);
            showCongrats(`+${reward} WTC`, icon || '📺', `≈ $${wtcToUsd(reward)} USD`);
            if (state.activeTab === 'task') paintTaskTop();
            return true;
        }
    }
    toast('Adsgram is still confirming your reward — it will appear in your balance shortly.', 'info');
    return false;
}
// 14 Oct 2026 — seconds still to wait before this network may be watched again (GigaPub 10s).
function adGapRemainingMs(ui) {
    if (!ui || !ui.gapSeconds) return 0;
    const last = state.user && state.user[ui.gapField];
    if (!last) return 0;
    return Math.max(0, new Date(last).getTime() + ui.gapSeconds * 1000 - Date.now());
}
// keeps the GO buttons' countdown alive while the Task tab is open
let __adGapTimer = null;
function startAdGapTicker() {
    if (__adGapTimer) clearInterval(__adGapTimer);
    const tick = () => {
        const btns = document.querySelectorAll('button.tk-go[data-gap-network]');
        if (!btns.length) { clearInterval(__adGapTimer); __adGapTimer = null; return; }
        btns.forEach(btn => {
            const ui = AD_NETWORKS_UI.find(n => n.id === btn.dataset.gapNetwork);
            const ms = adGapRemainingMs(ui);
            if (ms > 0) { if (btn._goHtml === undefined) btn._goHtml = btn.innerHTML; btn.disabled = true; btn.textContent = '⏳ ' + Math.ceil(ms / 1000) + 's'; }
            else if (btn._goHtml !== undefined) { btn.disabled = false; btn.innerHTML = btn._goHtml; btn._goHtml = undefined; }
        });
    };
    tick();
    __adGapTimer = setInterval(tick, 1000);
}
async function _watchAdNetworkInner(network) {
    const showFn = AD_SHOW_FUNCTIONS[network];
    { const _ui = AD_NETWORKS_UI.find(n => n.id === network); const _w = adGapRemainingMs(_ui);
      if (_w > 0) { toast('Please wait ' + Math.ceil(_w / 1000) + 's before the next ad.', 'info'); return; } }
    const networkLabel = AD_NETWORKS_UI.find(n => n.id === network)?.label || network;
    toast(`Loading ${networkLabel} ad...`, 'info');
    try {
        if (NO_TOKEN_NETWORKS.has(network)) { await showFn(); await creditAdReward(network); return; }
        if (S2S_NETWORKS.has(network)) {
            await apiPost('earn', { action: 'adIntent', purpose: 'earn' }); // tells the server this Special ad is a normal Earn ad (not mining/lootbox)
            await showFn();   // resolves only after Adsgram says the ad was watched; the server (not this phone) pays
            const ui = AD_NETWORKS_UI.find(n => n.id === network);
            await waitForS2sReward({ counterField: ui.counterField, reward: ui.reward, anchorEl: document.querySelector(`button[data-network="${network}"]`), icon: ui.icon });
            return;
        }
        const startRes = await apiPost('earn', { action: 'adStart', network });
        if (!startRes.ok) { toast(errorText(startRes.error), 'error'); return; }
        // ⚠️ NEW (ads update) — measure how long the ad was REALLY on screen
        // (SDK call → SDK promise resolves). Sent to the server, which rejects
        // anything shorter than that network's minWatchSeconds.
        const shownAt = Date.now();
        await showFn();
        const viewMs = Date.now() - shownAt;
        await creditAdReward(network, startRes.startTime, startRes.signature, viewMs);
    } catch (e) {
        // A network-specific, explicit message — a different network's ad is
        // never played instead; on failure the user is told directly to try
        // again or pick a different option.
        toast(`${networkLabel} ad isn't available right now. Please try again or pick a different network.`, 'error');
    }
}

async function creditAdReward(network, startTime, signature, viewMs) {
    let r = await apiPost('earn', { action: 'claimAdReward', network, startTime, signature, viewMs });
    // GigaPub is confirmed by its server's postback, which can land a moment AFTER the ad closes → retry a few times
    if (!r.ok && r.error === 'postback_pending') {
        toast('Confirming your reward…', 'info');
        for (let i = 0; i < 2 && !r.ok && r.error === 'postback_pending'; i++) { // v1.3: the server now waits ~8s itself
            await new Promise(res => setTimeout(res, 500));
            r = await apiPost('earn', { action: 'claimAdReward', network, startTime, signature, viewMs });
        }
    }
    if (r.ok) {
        toast(`+${r.reward} WTC added!`, 'success');
        triggerBurst(document.querySelector(`button[data-network="${network}"]`));
        showCongrats(`+${r.reward} WTC`, '📺', `≈ $${wtcToUsd(r.reward)} USD`);
        const _ui = AD_NETWORKS_UI.find(n => n.id === network);
        await refreshUserLazy(u => {
            u.wtcBalance = (u.wtcBalance || 0) + (r.reward || 0);
            u.lifetimeWtcEarned = (u.lifetimeWtcEarned || 0) + (r.reward || 0);
            u.lifetimeAdsWatched = (u.lifetimeAdsWatched || 0) + 1;
            if (_ui && _ui.counterField && r.countToday !== undefined) u[_ui.counterField] = r.countToday;
            if (_ui && _ui.gapField) u[_ui.gapField] = new Date().toISOString();
        });
        if (state.activeTab === 'task') paintTaskTop();
    } else { toast(errorText(r.error), 'error'); }
}

// Marks "a rewarded ad is on screen" so the passive Adsgram interstitial never pops over it.
async function watchAdNetwork(network) {
    window.__adBusy = true;
    try { await _watchAdNetworkInner(network); }
    finally { setTimeout(() => { window.__adBusy = false; }, 1500); }
}

function taskHubTotals(u) {
    let earned = 0, watched = 0, total = 0, maxReward = 0;
    AD_NETWORKS_UI.forEach(n => {
        const c = Math.min(u[n.counterField] || 0, n.limit);
        earned += c * n.reward; watched += c; total += n.limit; maxReward = Math.max(maxReward, n.reward);
    });
    if (ADSGRAM_TASK_BLOCK_IDS.length) {
        earned += Math.min(u.adsgramTaskCountToday || 0, ADSGRAM_TASK_LIMIT_UI) * ADSGRAM_TASK_REWARD_UI;
    }
    return { earned, watched, total, left: Math.max(0, total - watched), maxReward, pct: total ? Math.round((watched / total) * 100) : 0 };
}

function goToTask(taskId, url, category, verifyType) {
    // Open the link first
    if (url) window.open(url, '_blank');

    const task = state.tasks.find(t => t._id === taskId);
    // any category can be API-verified (Telegram join) via verifyType
    const isVerified = verifyType === 'api';
    const isUsdt = task?.rewardCurrency === 'usdt';
    const rewardTxt = '+' + (isUsdt ? (task?.rewardUsdt ?? 0) : (task?.rewardWtc || 0)) + ' ' + (isUsdt ? 'USDT' : 'WTC');
    const WAIT_MS = 4000; // 4s duration — mirrors TASK_MIN_WAIT_SECONDS (lib/constants.js); the SERVER enforces it
    const root = document.getElementById('modal-root');

    // Centered popup card (no more bottom slide-up sheet): 4s ring → then the Claim / Verify button appears in the middle.
    root.innerHTML = `
        <div class="tkm-overlay" onclick="if(event.target===this)this.remove()">
            <div class="tkm-card">
                <div class="tkm-ring" id="tkm-ring">
                    <svg width="84" height="84" viewBox="0 0 84 84"><circle class="bg" cx="42" cy="42" r="39"/><circle class="fg" cx="42" cy="42" r="39"/></svg>
                    <div class="tkm-ring-in" id="tkm-num">…</div>
                </div>
                <div class="tkm-name">${esc(task?.title || 'Task')}</div>
                <div class="tkm-reward">${esc(rewardTxt)}</div>
                <div class="tkm-hint" id="tkm-hint">Getting ready…</div>
                <div id="tkm-slot"></div>
                <button class="tkm-cancel" onclick="document.getElementById('modal-root').innerHTML=''">Cancel</button>
            </div>
        </div>`;

    const ring = document.getElementById('tkm-ring');
    const num = document.getElementById('tkm-num');
    const hint = document.getElementById('tkm-hint');
    const slot = document.getElementById('tkm-slot');

    // the 4s count starts only once the server-signed start token is in hand (non-API tasks),
    // so the client never finishes "before" the server's own 4s clock.
    let taskToken = null;
    const runCountdown = () => {
        if (!ring.isConnected) return;
        ring.classList.add('run');
        hint.textContent = isVerified ? 'Join the channel/group, then verify.' : 'Complete the task — your claim unlocks in a moment.';
        const t0 = Date.now();
        const tick = setInterval(() => {
            if (!ring.isConnected) { clearInterval(tick); return; }
            const left = WAIT_MS - (Date.now() - t0);
            if (left > 0) { num.textContent = Math.ceil(left / 1000); return; }
            clearInterval(tick);
            ring.classList.remove('run'); ring.classList.add('done');
            num.textContent = '✓';
            hint.textContent = isVerified ? 'Done joining? Tap Verify.' : 'All set! Tap Claim to get your reward.';
            slot.innerHTML = isVerified
                ? '<button class="tkm-act verify" id="tkm-act">✅ Verify Membership</button>'
                : '<button class="tkm-act" id="tkm-act">🎁 Claim Reward</button>';
            const act = document.getElementById('tkm-act');
            act.onclick = async () => {
                act.disabled = true;
                act.textContent = 'Checking...';
                await completeTask(taskId, taskToken);
            };
        }, 100);
    };

    if (isVerified) {
        runCountdown(); // API-verified tasks are proven by real Telegram membership — no start token needed
    } else {
        apiPost('earn', { action: 'taskStart', taskId }).then(r => {
            if (!ring.isConnected) return;
            if (r?.ok) { taskToken = { startTime: r.startTime, signature: r.signature }; runCountdown(); }
            else { document.getElementById('modal-root').innerHTML = ''; toast(errorText(r?.error), 'error'); }
        });
    }
}

async function completeTask(taskId, taskToken) {
    const r = await apiPost('earn', { action: 'taskComplete', taskId, startTime: taskToken?.startTime, signature: taskToken?.signature });
    document.getElementById('modal-root').innerHTML = ''; // close sheet
    if (r.ok) {
        toast(`+${r.rewardWtc} WTC added!`, 'success');
        triggerBurst(document.querySelector(`button[data-task="${taskId}"]`) || document.body);
        showCongrats(`+${r.rewardWtc} WTC`, '✅', `≈ $${wtcToUsd(r.rewardWtc)} USD`);
        await refreshUserLazy(u => {
            u.wtcBalance = (u.wtcBalance || 0) + (r.rewardWtc || 0);
            u.lifetimeWtcEarned = (u.lifetimeWtcEarned || 0) + (r.rewardWtc || 0);
            if (!Array.isArray(u.completedTasks)) u.completedTasks = [];
            if (!u.completedTasks.map(String).includes(String(taskId))) u.completedTasks.push(taskId);
        });

        // 20 Oct 2026 (admin): the card-vanish animation was removed — the list just refreshes right away.
        if (state.activeTab === 'task') renderTaskTab();
    }
    else if (r.alreadyDone) { toast('You already completed this task.', 'info'); }
    else if (r.error === 'not_member') { toast('Not a member yet — join first, then verify.', 'error'); }
    else { toast(errorText(r.error), 'error'); }
}

// ⚠️ NEW — "Create Task" button (Task tab). A user pays TON to publish
// their OWN task into the ⭐ Exclusive section. Payment is verified fully
// server-side/on-chain (api/payments.js (cron=checkDeposits)) — this modal
// only collects the task details, creates the order, and polls its
// status; it never inserts the task itself. Structurally mirrors
// openBuyValidReferModal (same payment-waiting screen shape), plus a
// list screen (existing created tasks + progress) and a details-form
// screen in front of it.
async function openCreateTaskModal() {
    let pollTimer = null;
    let countdownTimer = null;
    let closed = false;
    let order = null;
    const formData = { verifyType: 'api', channelUsername: '', url: '', title: '', package: '100', verified: '' };

    function stopTimers() {
        if (pollTimer) clearInterval(pollTimer);
        if (countdownTimer) clearInterval(countdownTimer);
    }
    function close(refreshTasks) {
        if (closed) return;
        closed = true;
        stopTimers();
        document.getElementById('modal-root').innerHTML = '';
        if (refreshTasks && state.activeTab === 'task') renderTaskTab();
    }
    window.__closeCreateTask = close;

    // ── screens 1+2: ONE sheet with two tabs — "New Task" (form) + "My Tasks" (history) ──
    // ⚠️ REDESIGNED — channel/group tasks now require a server-side "Verify bot"
    // step (payments?resource=taskcreate action=verifyBot) BEFORE the user can
    // pay, so nobody pays TON for a task that can never be verified.
    function normChannel(v) {
        let s = String(v || '').trim();
        const m = s.match(/t\.me\/([a-zA-Z0-9_]+)/);
        if (m) s = m[1];
        return s.replace(/^@/, '').toLowerCase();
    }
    function captureFormFields() {
        const ch = document.getElementById('ct-channel'); if (ch) formData.channelUsername = ch.value;
        const url = document.getElementById('ct-url'); if (url) formData.url = url.value;
        const title = document.getElementById('ct-title'); if (title) formData.title = title.value;
    }
    function renderForm() { renderMain('new'); }

    async function paintHistory() {
        const body = document.getElementById('ct-hist');
        if (!body) return;
        const r = await apiGet(`payments?resource=taskcreate&action=myTasks&initData=${encodeURIComponent(TG_INIT_DATA)}`);
        const host = document.getElementById('ct-hist');
        if (!host) return; // modal closed / tab switched before this resolved
        if (!r.ok || !r.tasks?.length) {
            host.innerHTML = `<div class="muted" style="font-size:12.5px; text-align:center; padding:26px 0;">You haven't posted any tasks yet.</div>`;
            return;
        }
        host.innerHTML = r.tasks.map(t => {
            const limit = t.limit || 0;
            const done = t.completionCount || 0;
            const pct = limit ? Math.min(100, Math.round((done / limit) * 100)) : 0;
            const isDone = limit > 0 && done >= limit;
            if (t.reviewStatus === 'rejected') {
                return `<div class="ct-hrow" style="opacity:0.7;"><div class="ct-hname">${esc(t.title)}</div><div class="ct-hstat" style="color:var(--danger);">❌ Rejected</div></div>`;
            }
            if (t.reviewStatus === 'pending_review' || !t.isApproved) {
                return `<div class="ct-hrow"><div class="ct-hname">${esc(t.title)}</div><div class="ct-hstat" style="color:var(--pending);">⏳ In review</div></div>`;
            }
            return `<div class="ct-hrow" style="display:block;">
                <div style="display:flex; justify-content:space-between; gap:8px; align-items:center;">
                    <div class="ct-hname">${esc(t.title)}</div>
                    <div class="ct-hstat mono-num" style="color:${isDone ? 'var(--success)' : 'var(--ink-muted)'};">${done}/${limit}${isDone ? ' ✅' : ''}</div>
                </div>
                <div class="ct-bar"><div style="width:${pct}%;"></div></div>
            </div>`;
        }).join('');
    }

    function renderMain(tab) {
        const isNew = tab === 'new';
        const price = TASK_CREATE_PACKAGES_DISPLAY[formData.package];
        const chNorm = normChannel(formData.channelUsername);
        const isApi = formData.verifyType === 'api';
        const isVerified = isApi && !!formData.verified && formData.verified === chNorm;
        const BADGES = { '500': 'HOT', '2000': 'BEST DEAL' };

        const formHtml = `
            <div class="ct-types">
                <button class="ct-type ${isApi ? 'on' : ''}" data-vtype="api"><span class="ct-type-ic">📢</span><span><b>Channel / Group</b><small>Bot-verified join</small></span></button>
                <button class="ct-type ${!isApi ? 'on' : ''}" data-vtype="link"><span class="ct-type-ic">🔗</span><span><b>Bot / Website</b><small>Any link</small></span></button>
            </div>

            <div class="ct-label">Task title</div>
            <input class="field-input" id="ct-title" placeholder="e.g. Join our official channel" maxlength="80" value="${esc(formData.title)}">

            ${isApi ? `
                <div class="ct-label">Channel / group username</div>
                <div class="ct-row">
                    <input class="field-input" id="ct-channel" placeholder="@your_channel" value="${esc(formData.channelUsername)}" autocapitalize="off" autocomplete="off">
                    <button class="ct-verify ${isVerified ? 'ok' : ''}" id="ct-verify">${isVerified ? '✓ Verified' : 'Verify bot'}</button>
                </div>
                <div class="ct-note ${isVerified ? 'ok' : ''}" id="ct-note">${isVerified
                    ? `✓ NEWTUBE bot is an admin in @${esc(chNorm)}`
                    : '⚠️ Add the NEWTUBE bot as an Admin there first, then tap Verify bot. You can pay only after it is verified.'}</div>
            ` : `
                <div class="ct-label">Link (Telegram bot or website)</div>
                <input class="field-input" id="ct-url" placeholder="https://..." value="${esc(formData.url)}" autocapitalize="off" autocomplete="off">
            `}

            <div class="ct-label">Package · pay with TON</div>
            <div class="ct-pkgs">
                ${Object.entries(TASK_CREATE_PACKAGES_DISPLAY).map(([count, p]) => `
                    <button class="ct-pkg ${formData.package === count ? 'on' : ''}" data-pkg="${count}">
                        ${BADGES[count] ? `<span class="ct-badge">${BADGES[count]}</span>` : ''}
                        <span class="ct-pkg-n">${Number(count).toLocaleString('en-US')}</span>
                        <span class="ct-pkg-u">users</span>
                        <span class="ct-pkg-p">💎 ${p.toFixed(2)} TON</span>
                    </button>`).join('')}
            </div>

            <div class="ct-reward">🎁 Every user who completes it earns <b>${TASK_CREATE_REWARD_PER_TASK_WTC_DISPLAY} WTC</b></div>

            <div class="ct-sum">
                <div><small>You are buying</small><b>${Number(formData.package).toLocaleString('en-US')} completions</b></div>
                <div class="ct-sum-p">💎 ${price.toFixed(2)} TON</div>
            </div>
            <button class="btn btn-primary" id="ct-submit" style="width:100%; margin-top:12px;">Pay ${price.toFixed(2)} TON</button>
        `;

        document.getElementById('modal-root').innerHTML = `
            <div class="overlay" onclick="if(event.target===this){window.__closeCreateTask?.();}">
                <div class="sheet anim-in" style="max-height:90vh; overflow-y:auto;">
                    <div class="sheet-handle"></div>
                    <div class="ct-head">
                        <div class="ct-title">🚀 Promote a Task</div>
                        <button class="ct-x" id="ct-x" aria-label="Close">✕</button>
                    </div>
                    <div class="ct-tabs">
                        <button data-ctab="new" class="${isNew ? 'on' : ''}">＋ New Task</button>
                        <button data-ctab="history" class="${!isNew ? 'on' : ''}">📋 My Tasks</button>
                    </div>
                    ${isNew ? formHtml : `<div id="ct-hist"><div class="skel" style="height:50px; margin:8px 0; border-radius:12px;"></div><div class="skel" style="height:50px; margin:8px 0; border-radius:12px;"></div></div>`}
                </div>
            </div>`;

        document.getElementById('ct-x').onclick = () => close();
        document.querySelectorAll('[data-ctab]').forEach(b => b.onclick = () => { captureFormFields(); renderMain(b.dataset.ctab); });

        if (!isNew) { paintHistory(); return; }

        document.querySelectorAll('[data-vtype]').forEach(b => b.onclick = () => { captureFormFields(); formData.verifyType = b.dataset.vtype; renderMain('new'); });
        document.querySelectorAll('[data-pkg]').forEach(b => b.onclick = () => { captureFormFields(); formData.package = b.dataset.pkg; renderMain('new'); });
        document.getElementById('ct-submit').onclick = submitForm;

        if (isApi) {
            // typing a different username after verifying invalidates the ✓ right away
            document.getElementById('ct-channel').oninput = (e) => {
                const stillOk = !!formData.verified && formData.verified === normChannel(e.target.value);
                const vb = document.getElementById('ct-verify'); const nt = document.getElementById('ct-note');
                if (!vb || !nt) return;
                vb.classList.toggle('ok', stillOk);
                vb.textContent = stillOk ? '✓ Verified' : 'Verify bot';
                nt.classList.toggle('ok', stillOk);
                nt.textContent = stillOk
                    ? `✓ NEWTUBE bot is an admin in @${normChannel(e.target.value)}`
                    : '⚠️ Add the NEWTUBE bot as an Admin there first, then tap Verify bot. You can pay only after it is verified.';
            };
            document.getElementById('ct-verify').onclick = async () => {
                captureFormFields();
                const ch = normChannel(formData.channelUsername);
                if (!ch) return toast('Enter the channel/group username first.', 'error');
                const vb = document.getElementById('ct-verify');
                vb.disabled = true; vb.textContent = 'Checking…';
                const r = await apiPost('payments', { resource: 'taskcreate', action: 'verifyBot', channelUsername: ch });
                if (!document.getElementById('ct-verify')) return; // modal closed before this resolved
                captureFormFields();
                if (r.ok) { formData.verified = ch; toast('Bot verified ✓', 'success'); }
                else { formData.verified = ''; toast(errorText(r.error), 'error'); }
                renderMain('new');
            };
        }
    }

    async function submitForm() {
        captureFormFields();
        formData.title = formData.title.trim();
        if (!formData.title) return toast('Please enter a task title.', 'error');
        if (formData.verifyType === 'api') {
            const ch = normChannel(formData.channelUsername);
            if (!ch) return toast('Please enter a channel/group username.', 'error');
            if (formData.verified !== ch) return toast('Tap "Verify bot" first — the bot must be admin there.', 'error');
        }
        if (formData.verifyType === 'link' && !formData.url.trim()) return toast('Please enter a link.', 'error');

        const btn = document.getElementById('ct-submit');
        const idleLabel = btn.textContent;
        btn.textContent = 'Creating order...';
        btn.disabled = true;
        const r = await apiPost('payments', {
            resource: 'taskcreate',
            action: 'create',
            package: formData.package,
            title: formData.title,
            verifyType: formData.verifyType,
            channelUsername: formData.channelUsername,
            url: formData.url,
        });
        if (!document.getElementById('ct-submit')) return; // modal closed before this resolved
        if (!r.ok) {
            toast(errorText(r.error), 'error');
            btn.textContent = idleLabel;
            btn.disabled = false;
            return;
        }
        order = r.order;
        renderPay();
    }

        document.getElementById('modal-root').innerHTML = `
            <div class="overlay" onclick="if(event.target===this){window.__closeCreateTask?.();}">

                    <div class="card" style="padding:14px; margin-bottom:12px;">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                            <span class="muted" style="font-size:12px;">Amount</span>
                            <span class="mono-num" style="font-size:15px; font-weight:700;">${(order.amountNanoTon / 1_000_000_000).toFixed(4)} TON</span>
                        </div>
                        <div class="field-label" style="margin-top:0;">Send to this address</div>
                        <div style="display:flex; gap:8px; align-items:center;">
                            <div class="mono-num" style="flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; background:var(--surface-raised); padding:9px 10px; border-radius:8px;">${order.address}</div>

                        <div style="display:flex; gap:8px; align-items:center;">
                            <div class="mono-num" style="flex:1; font-size:15px; font-weight:700; letter-spacing:1px; background:var(--surface-raised); padding:9px 10px; border-radius:8px; text-align:center;">${order.memo}</div>

                        </div>

                    </div>

                    <div style="text-align:center; margin-top:16px;">
                        <div id="ct-status-line" style="font-size:13px; color:var(--pending); display:flex; align-items:center; justify-content:center; gap:6px;">
                            <span style="width:12px; height:12px; border-radius:50%; border:2px solid var(--pending); border-top-color:transparent; display:inline-block; animation:spin 0.8s linear infinite;"></span>
                            Waiting for payment...
                        </div>
                        <div id="ct-countdown" class="muted" style="font-size:11.5px; margin-top:6px;"></div>
                    </div>

                    <button class="btn btn-outline" id="ct-cancel" style="width:100%; margin-top:14px; font-size:12.5px;">Cancel order</button>
                </div>
            </div>`;

        document.getElementById('ct-copy-addr').onclick = () => { navigator.clipboard.writeText(order.address); toast('Address copied!', 'success'); };
        document.getElementById('ct-copy-memo').onclick = () => { navigator.clipboard.writeText(order.memo); toast('Memo copied!', 'success'); };
        document.getElementById('ct-open-tonkeeper').onclick = () => openTonkeeperLink(order.deepLink);
        document.getElementById('ct-cancel').onclick = async () => {
            stopTimers();
            await apiPost('payments', { resource: 'taskcreate', action: 'cancel', orderId: order.id });
            toast('Order cancelled.', 'info');
            close();
        };

        startCountdown();
        startPolling();
    }

    function startCountdown() {
        const expiresAt = new Date(order.expiresAt).getTime();
        const tick = () => {
            const el = document.getElementById('ct-countdown');
            if (!el) { clearInterval(countdownTimer); return; }
            const msLeft = expiresAt - Date.now();
            if (msLeft <= 0) {
                el.textContent = 'Expired';
                clearInterval(countdownTimer);
                return;
            }
            const mm = Math.floor(msLeft / 60000);
            const ss = Math.floor((msLeft % 60000) / 1000);
            el.textContent = `Auto-cancels in ${mm}:${String(ss).padStart(2, '0')} if unpaid`;
        };
        tick();
        countdownTimer = setInterval(tick, 1000);
    }

    function startPolling() {
        pollTimer = setInterval(async () => {
            const s = await apiGet(`payments?resource=taskcreate&action=status&orderId=${order.id}&initData=${encodeURIComponent(TG_INIT_DATA)}`);
            if (!document.getElementById('ct-status-line')) { clearInterval(pollTimer); return; } // modal closed
            if (!s.ok) return; // transient error — just try again next tick
            if (s.status === 'paid') {
                stopTimers();
                triggerBurst(document.getElementById('modal-root'));
                showCongrats('Payment Confirmed!', '⏳');
                toast('Payment confirmed — your task is now pending admin review.', 'success');
                setTimeout(() => close(true), 1200);
            } else if (s.status === 'expired') {
                stopTimers();
                document.getElementById('modal-root').innerHTML = `
                    <div class="overlay" onclick="if(event.target===this)this.remove()">
                        <div class="sheet anim-in">
                            <div class="sheet-handle"></div>
                            <div style="text-align:center; padding:20px 0;">
                                <div style="font-size:34px; margin-bottom:10px;">⌛</div>
                                <div style="font-weight:600; margin-bottom:6px;">Order expired</div>
                                <div class="muted" style="font-size:12.5px; line-height:1.55; margin-bottom:16px;">No payment was detected within ${TASK_CREATE_ORDER_EXPIRY_MIN_DISPLAY} minutes.<br><b>If you already sent the TON, do NOT pay again</b> — it is credited automatically within a few minutes of the network confirming it, and you will get a Telegram message. If nothing arrives, contact support with your transaction hash.</div>
                                <button class="btn btn-primary" id="ct-retry" style="width:100%;">Try again</button>
                            </div>
                        </div>
                    </div>`;
                document.getElementById('ct-retry').onclick = renderForm;
            }
        }, 4000);
    }

    renderMain('new');
}
